<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AR Draw: Easy Sketching</title>
  <style>
    :root { --primary: #5b21b6; --text: #1e1b4b; --muted: #4c4f6b; --bg: #faf8ff; }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      text-align: center;
      padding: 2rem 1.25rem;
    }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      background: linear-gradient(135deg, #5b21b6, #7c3aed);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 1.5rem;
      margin: 0 auto 1rem;
    }
    h1 { margin: 0 0 0.5rem; font-size: 1.5rem; }
    p { margin: 0 0 1.5rem; color: var(--muted); max-width: 420px; }
    .links { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; }
    a.btn {
      display: inline-block;
      padding: 0.65rem 1.25rem;
      border-radius: 999px;
      background: var(--primary);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }
    a.btn.secondary {
      background: #fff;
      color: var(--primary);
      border: 2px solid #c4b5fd;
    }
  </style>
</head>
<body>
  <div class="logo">AR</div>
  <h1>AR Draw: Easy Sketching</h1>
  <p>Traza dibujos con la cámara o la pantalla. Plantillas gratis y premium.</p>
  <div class="links">
    <a class="btn" href="privacy.html">Política de privacidad</a>
    <a class="btn secondary" href="privacy-en.html">Privacy Policy</a>
  </div>
</body>
</html>
